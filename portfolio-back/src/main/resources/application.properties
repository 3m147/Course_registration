spring.application.name=portfolio

server.port=${SERVER_PORT:9090}

# MariaDB connection 
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mariadb://localhost:3306/portfolio_final}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:portfolio_password}

# spring data JPA
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
	# create-drop: 서버 시작시 자동으로 테이블 생성, 서버 종료시 자동으로 DROP함
	# 테스트 / 연습환경에서 유용함
	# 실제 환경에서는 update 또는 none을 사용
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:true}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
	# 실행하는 쿼리문을 콘솔에 출력하도록 함. 
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Logging (SQL logs)
logging.level.org.springframework.jdbc.core=DEBUG
logging.level.org.mybatis=DEBUG

# File uploads
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
	## total request size, including the files (+ other data)
spring.servlet.multipart.max-request-size=20MB
	## temp folder
		### in windows, path separator is \ but in linux or mac it is /
spring.servlet.multipart.location=${APP_UPLOAD_TMP_DIR:${java.io.tmpdir}}
	## actual save path
		### this variable does not exist, we have to define it

# JWT
jwt.expiration_time=${JWT_EXPIRATION_TIME:1440}
jwt.secret=${JWT_SECRET:change-this-local-development-secret-change-before-deploy}
jwt.refresh.expiration_time=${JWT_REFRESH_EXPIRATION_TIME:43200}

# OAuth-Google
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=email, profile
spring.profiles.include=oauth

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
app.oauth.success-redirect-url=${APP_OAUTH_SUCCESS_REDIRECT_URL:http://localhost:3000/oauth/callback}
app.upload.image-dir=${APP_UPLOAD_IMAGE_DIR:${user.home}/portfolio/uploads}
